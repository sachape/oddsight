server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # Cache long pour les assets fingerprintés
  location /assets/ {
    expires 1y;
    add_header Cache-Control "public, immutable";
  }

  # SPA : tout retombe sur index.html. Le HTML NE doit PAS être mis en cache dur :
  # il référence les assets fingerprintés, donc un index.html périmé fait tourner
  # l'ancien JS même après un déploiement (bug observé : un vieux hash #tennis
  # restait, code d'avant le fix servi). no-cache = revalidation systématique (304
  # si inchangé), les nouveaux déploiements sont pris en compte immédiatement.
  location / {
    try_files $uri $uri/ /index.html;
    add_header Cache-Control "no-cache";
  }
}
